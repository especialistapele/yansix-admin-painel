name: YANSIX Watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testes do Watchdog
        run: node --test watchdog/tests/engine.test.mjs

      - name: Executar Watchdog
        run: node watchdog/src/main.mjs

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-report
          path: |
            watchdog/report.md
            watchdog/report.json
          if-no-files-found: warn
